name: Prepare draft release

'on':
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag vX.Y.Z or vX.Y.Z-rc.N'
        type: string
        required: true
      approved_sha:
        description: 'Reviewed full lowercase 40-character commit SHA already on main'
        type: string
        required: true
      acceptance_confirmed:
        description: 'Applicable acceptance is complete and limitations are recorded'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: release-draft-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  APPROVED_SHA: ${{ inputs.approved_sha }}
  ACCEPTED: ${{ inputs.acceptance_confirmed }}
  CI_REF: ${{ github.ref }}
  CI_EVENT: ${{ github.event_name }}

jobs:
  build:
    name: Verify source and build candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      zip_name: ${{ steps.package.outputs.zip_name }}
      zip_sha256: ${{ steps.package.outputs.zip_sha256 }}
      checksum_sha256: ${{ steps.package.outputs.checksum_sha256 }}
      notes_sha256: ${{ steps.package.outputs.notes_sha256 }}
      metadata_sha256: ${{ steps.package.outputs.metadata_sha256 }}
    steps:
      - name: Verify explicit acceptance and existing tag through GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PYREF'
          import json, os, re, urllib.error, urllib.request
          if os.environ['CI_EVENT'] != 'workflow_dispatch' or os.environ['CI_REF'] != 'refs/heads/main':
              raise SystemExit('Release preparation must be dispatched from main')
          if os.environ['ACCEPTED'] != 'true':
              raise SystemExit('Confirm completed acceptance explicitly before preparing a draft')
          tag, commit = os.environ['RELEASE_TAG'], os.environ['APPROVED_SHA']
          match = re.fullmatch(r'v((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))(?:-rc\.[1-9][0-9]*)?', tag)
          if not match or not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('Expected vX.Y.Z[-rc.N] and a full lowercase commit SHA')
          parts = [int(part) for part in match[1].split('.')]
          if not any(parts) or max(parts) > 65535:
              raise SystemExit('Version is outside Chrome bounds')
          repo = os.environ['GITHUB_REPOSITORY']
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repo):
              raise SystemExit('Invalid repository identity')
          def get(suffix, absent_ok=False):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + '/' + suffix,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  error.close()
                  if absent_ok and error.code == 404:
                      return None
                  raise
          obj = get('git/ref/tags/' + tag)['object']
          for _ in range(8):
              if obj['type'] == 'commit':
                  break
              if obj['type'] != 'tag' or not re.fullmatch(r'[0-9a-f]{40}', obj['sha']):
                  raise SystemExit('Tag must resolve to a commit')
              obj = get('git/tags/' + obj['sha'])['object']
          else:
              raise SystemExit('Annotated tag nesting limit exceeded')
          if obj['type'] != 'commit' or obj['sha'] != commit:
              raise SystemExit('Existing tag does not point to the approved commit')
          comparison = get('compare/' + commit + '...main')
          if comparison['status'] not in ('identical', 'ahead') or comparison['merge_base_commit']['sha'] != commit:
              raise SystemExit('Approved commit must belong to main history')
          if get('releases/tags/' + tag, absent_ok=True) is not None:
              raise SystemExit('A release already exists; refuse to replace assets or update it')
          # Tag lookup can omit drafts; the authenticated list is authoritative.
          for page in range(1, 101):
              releases = get('releases?per_page=100&page=' + str(page))
              if not isinstance(releases, list):
                  raise SystemExit('Invalid release list response')
              if any(release.get('tag_name') == tag for release in releases):
                  raise SystemExit('A release or draft already exists; refuse to create another')
              if len(releases) < 100:
                  break
          else:
              raise SystemExit('Release list limit exceeded; inspect the repository manually')
          print('Verified existing tag -> approved commit on main; no release or draft exists')
          PYREF
      - name: Check out only the approved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.approved_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Snapshot source before running checks
        run: >-
          python3 -B scripts/release_candidate.py snapshot
          --tag "$RELEASE_TAG" --commit "$APPROVED_SHA"
          --snapshot "$RUNNER_TEMP/source-snapshot.json"
      - name: Show reviewed check contract
        run: python3 -B scripts/check.py --list
      - name: Run offline contract
        run: python3 -B scripts/check.py --execute-reviewed 57cd7c8e1464c134e0a27e109c4d782619f88bc5e3c73ded8e3b4cc8547b0bd9
      - name: Verify unchanged source and package candidate
        id: package
        run: >-
          python3 -B scripts/release_candidate.py prepare
          --tag "$RELEASE_TAG" --commit "$APPROVED_SHA"
          --snapshot "$RUNNER_TEMP/source-snapshot.json"
          --output "$RUNNER_TEMP/release-candidate"
      - name: Store exact candidate for the draft job
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-candidate/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  draft:
    name: Create a draft for review
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      ZIP_NAME: ${{ needs.build.outputs.zip_name }}
      ZIP_SHA256: ${{ needs.build.outputs.zip_sha256 }}
      CHECKSUM_SHA256: ${{ needs.build.outputs.checksum_sha256 }}
      NOTES_SHA256: ${{ needs.build.outputs.notes_sha256 }}
      METADATA_SHA256: ${{ needs.build.outputs.metadata_sha256 }}
    steps:
      # No checkout or execution of repository/downloaded code in this write job.
      - name: Download only the artifact produced by this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-artifact
          merge-multiple: true
      - name: Verify artifact against trusted build outputs using fixed inline code
        run: |
          set -euo pipefail
          python3 - <<'PYARTIFACT'
          import hashlib, json, os, re
          from pathlib import Path
          from zipfile import ZipFile
          root = Path('release-artifact')
          tag, commit = os.environ['RELEASE_TAG'], os.environ['APPROVED_SHA']
          match = re.fullmatch(r'v((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))(?:-rc\.[1-9][0-9]*)?', tag)
          if not match or not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('Invalid approved release identity')
          version = match[1]
          zip_name = 'country-proxy-' + version + '.zip'
          if os.environ['ZIP_NAME'] != zip_name:
              raise SystemExit('Unexpected artifact filename')
          expected = {zip_name: os.environ['ZIP_SHA256'], zip_name + '.sha256': os.environ['CHECKSUM_SHA256'],
                      'release-notes.md': os.environ['NOTES_SHA256'], 'release-metadata.json': os.environ['METADATA_SHA256']}
          if set(p.name for p in root.iterdir()) != set(expected):
              raise SystemExit('Artifact has missing or additional files')
          for name, digest in expected.items():
              p = root / name
              if p.is_symlink() or not p.is_file() or not re.fullmatch(r'[0-9a-f]{64}', digest):
                  raise SystemExit('Unsafe artifact path or invalid expected checksum')
              if hashlib.sha256(p.read_bytes()).hexdigest() != digest:
                  raise SystemExit('Artifact differs from read-only build job output: ' + name)
          metadata = json.loads((root / 'release-metadata.json').read_text())
          if (metadata.get('schema_version') != 1 or metadata.get('tag') != tag or metadata.get('commit') != commit
                  or metadata.get('version') != version or metadata.get('published') is not False
                  or metadata.get('kind') != 'draft-release-candidate'):
              raise SystemExit('Artifact metadata does not match approved identity')
          if metadata.get('assets') != {name: digest for name, digest in expected.items() if name != 'release-metadata.json'}:
              raise SystemExit('Asset inventory mismatch')
          if (root / (zip_name + '.sha256')).read_text() != expected[zip_name] + '  ' + zip_name + '\n':
              raise SystemExit('Checksum sidecar mismatch')
          files = metadata['source_files']
          if not isinstance(files, dict) or not files:
              raise SystemExit('Missing source inventory')
          for name, digest in files.items():
              if (not isinstance(name, str) or name.startswith('/') or '..' in name.split('/')
                      or not re.fullmatch(r'[0-9a-f]{64}', digest)):
                  raise SystemExit('Invalid source inventory entry')
          with ZipFile(root / zip_name) as archive:
              names = archive.namelist()
              if len(names) != len(set(names)) or set(names) != {'country-proxy/' + name for name in [*files, 'BUILD-MANIFEST.json']}:
                  raise SystemExit('ZIP entries differ from reviewed source inventory')
              inventory = json.loads(archive.read('country-proxy/BUILD-MANIFEST.json'))
              if inventory.get('files') != files or inventory.get('version') != version or inventory.get('release_verified') is not False:
                  raise SystemExit('ZIP build manifest mismatch')
              for name, digest in files.items():
                  if hashlib.sha256(archive.read('country-proxy/' + name)).hexdigest() != digest:
                      raise SystemExit('ZIP source content mismatch: ' + name)
          print('Artifact checksums and source inventory match outputs of this run')
          PYARTIFACT
      - name: Recheck existing tag and refuse any existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PYREF'
          import json, os, re, urllib.error, urllib.request
          if os.environ['CI_EVENT'] != 'workflow_dispatch' or os.environ['CI_REF'] != 'refs/heads/main':
              raise SystemExit('Release preparation must be dispatched from main')
          if os.environ['ACCEPTED'] != 'true':
              raise SystemExit('Confirm completed acceptance explicitly before preparing a draft')
          tag, commit = os.environ['RELEASE_TAG'], os.environ['APPROVED_SHA']
          match = re.fullmatch(r'v((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))(?:-rc\.[1-9][0-9]*)?', tag)
          if not match or not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('Expected vX.Y.Z[-rc.N] and a full lowercase commit SHA')
          parts = [int(part) for part in match[1].split('.')]
          if not any(parts) or max(parts) > 65535:
              raise SystemExit('Version is outside Chrome bounds')
          repo = os.environ['GITHUB_REPOSITORY']
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repo):
              raise SystemExit('Invalid repository identity')
          def get(suffix, absent_ok=False):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + '/' + suffix,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  error.close()
                  if absent_ok and error.code == 404:
                      return None
                  raise
          obj = get('git/ref/tags/' + tag)['object']
          for _ in range(8):
              if obj['type'] == 'commit':
                  break
              if obj['type'] != 'tag' or not re.fullmatch(r'[0-9a-f]{40}', obj['sha']):
                  raise SystemExit('Tag must resolve to a commit')
              obj = get('git/tags/' + obj['sha'])['object']
          else:
              raise SystemExit('Annotated tag nesting limit exceeded')
          if obj['type'] != 'commit' or obj['sha'] != commit:
              raise SystemExit('Existing tag does not point to the approved commit')
          comparison = get('compare/' + commit + '...main')
          if comparison['status'] not in ('identical', 'ahead') or comparison['merge_base_commit']['sha'] != commit:
              raise SystemExit('Approved commit must belong to main history')
          if get('releases/tags/' + tag, absent_ok=True) is not None:
              raise SystemExit('A release already exists; refuse to replace assets or update it')
          # Tag lookup can omit drafts; the authenticated list is authoritative.
          for page in range(1, 101):
              releases = get('releases?per_page=100&page=' + str(page))
              if not isinstance(releases, list):
                  raise SystemExit('Invalid release list response')
              if any(release.get('tag_name') == tag for release in releases):
                  raise SystemExit('A release or draft already exists; refuse to create another')
              if len(releases) < 100:
                  break
          else:
              raise SystemExit('Release list limit exceeded; inspect the repository manually')
          print('Verified existing tag -> approved commit on main; no release or draft exists')
          PYREF
      - name: Create draft only, with verified tag and assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          args=("$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --latest=false
            --target "$APPROVED_SHA" --title "Country Proxy $RELEASE_TAG"
            --notes-file release-artifact/release-notes.md)
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then args+=(--prerelease); fi
          gh release create "${args[@]}" "release-artifact/$ZIP_NAME" "release-artifact/$ZIP_NAME.sha256"
          # On upload failure keep any created draft for inspection. Never clobber,
          # delete, publish, mark latest, or create a missing tag automatically.
